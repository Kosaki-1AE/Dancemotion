<!DOCTYPE html>
<html>
<head>
    <title>位置情報とGoogle Earth</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Chrome">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <button onclick="initEarth()">Google Earthを表示</button>
    <div id="earth-container" style="width: 100%; height: 500px;"></div>

    <script>
        var earth; // Google Earthオブジェクト

        function initEarth() {
            // Google Earthを初期化
            google.earth.createInstance('earth-container', function(instance) {
                earth = instance;
                earth.getWindow().setVisibility(true);
                earth.getOptions().setFlyToSpeed(earth.SPEED_TELEPORT);
                
                // 位置情報を取得
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            var latitude = position.coords.latitude;
                            var longitude = position.coords.longitude;
                            var altitude = 0; // 標高
                            
                            var lookAt = earth.getView().copyAsLookAt(earth.ALTITUDE_RELATIVE_TO_GROUND);
                            lookAt.setLatitude(latitude);
                            lookAt.setLongitude(longitude);
                            lookAt.setRange(altitude + 1000); // カメラの高さを設定（地図上の高さ）
                            earth.getView().setAbstractView(lookAt);
                        },
                        function(error) {
                            var errorMessage = "位置情報の取得に失敗しました。";

                            switch (error.code) {
                                case error.PERMISSION_DENIED:
                                    errorMessage = "位置情報の取得が許可されていません。";
                                    break;
                                case error.POSITION_UNAVAILABLE:
                                    errorMessage = "位置情報が利用できません。";
                                    break;
                                case error.TIMEOUT:
                                    errorMessage = "タイムアウトしました。";
                                    break;
                                case error.UNKNOWN_ERROR:
                                    errorMessage = "不明なエラーが発生しました。";
                                    break;
                            }
                            alert(errorMessage);
                        }
                    );
                } else {
                    alert("お使いのブラウザはジオロケーションをサポートしていません。");
                }
            }, function(error) {
                alert("Google Earthの読み込み中にエラーが発生しました。");
            });
        }
    </script>

    <!-- Google EarthのAPIスクリプトを読み込む -->
    <script src="https://www.google.com/jsapi"></script>
    <script>
        google.load("earth", "1");

        google.setOnLoadCallback(function() {
            // ページが読み込まれたらinitEarthを呼び出す
            initEarth();
        });
    </script>
</body>
</html>
