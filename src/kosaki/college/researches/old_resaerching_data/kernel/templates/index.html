<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MiniShell Web</title>
  <style>
    body {
      background-color: #111;
      color: #0f0;
      font-family: monospace;
      padding: 1em;
    }
    input[type=text] {
      width: 100%;
      background-color: #000;
      color: #0f0;
      border: none;
      padding: 0.5em;
      font-size: 1em;
    }
    .output {
      white-space: pre-wrap;
      margin-top: 1em;
    }
    .history {
      margin-top: 1em;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>🧠 MiniShell Web</h1>
  <form method="POST">
    <input type="text" name="command" placeholder="Enter command..." autofocus>
  </form>
  <div class="output">{{ output }}</div>
  <div class="history">
    <h3>Command History:</h3>
    {% for cmd in history %}
      <div>{{ loop.index }}: {{ cmd }}</div>
    {% endfor %}
  </div>
</body>
</html>
